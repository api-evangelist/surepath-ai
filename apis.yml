name: SurePath AI
description: SurePath AI (now part of F5) is an enterprise AI governance and security
  platform that lets organizations safely adopt generative AI across their workforce.
  The platform gives security and IT teams visibility into GenAI usage by recording
  conversations, mitigates risk by detecting and redacting sensitive data in prompts
  and enforcing role-based access guardrails to public and private models, and
  increases safe adoption through a branded enterprise GenAI portal that enriches
  interactions with enterprise data. It is delivered as a SaaS product with an admin
  console rather than a public developer API, and maintains SOC 2 compliance.
